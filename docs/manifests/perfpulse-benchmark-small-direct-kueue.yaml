apiVersion: v1
kind: Namespace
metadata:
  name: canfar-perfpulse
---
apiVersion: v1
kind: Namespace
metadata:
  name: canfar-workloads
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: benchmark-small
  name: canfar-perfpulse
  namespace: canfar-perfpulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: benchmark-small
  name: perfpulse-workload-writer
  namespace: canfar-workloads
rules:
  -
    apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
  -
    apiGroups:
      - kueue.x-k8s.io
    resources:
      - workloads
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: benchmark-small
  name: perfpulse-workload-writer
  namespace: canfar-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perfpulse-workload-writer
subjects:
  -
    kind: ServiceAccount
    name: canfar-perfpulse
    namespace: canfar-perfpulse
---
apiVersion: v1
data:
  CLEANUP: "true"
  COMPLETION_GATE_SECONDS: "300"
  K6_OTEL_EXPORTER_PROTOCOL: http/protobuf
  K6_OTEL_HTTP_EXPORTER_INSECURE: "true"
  K6_OTEL_HTTP_EXPORTER_ENDPOINT: kube-prometheus-stack-prometheus.monitoring:9090
  K6_OTEL_HTTP_EXPORTER_URL_PATH: /api/v1/otlp/v1/metrics
  K6_OTEL_METRIC_PREFIX: k6_
  K6_OTEL_SERVICE_NAME: perfpulse-benchmark-small-direct
  K6_OTEL_EXPORT_INTERVAL: 1s
  LOGICAL_USERS: "100"
  PERF_PULSE_CLIENT_MODE: kubernetes
  PROFILE: benchmark-small
  RUN_CLASS: benchmark
  SCENARIO: many-small-users
  SURFACE: k8s-direct
  TOTAL_JOBS: "100"
  VISIBILITY_GATE_SECONDS: "120"
  WORKLOAD_NAMESPACE: canfar-workloads
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: benchmark-small
  name: perfpulse-benchmark-small-direct-config
  namespace: canfar-perfpulse
---
apiVersion: v1
data:
  CLEANUP: "true"
  COMPLETION_GATE_SECONDS: "300"
  KUEUE_ADMISSION_GATE_SECONDS: "300"
  KUEUE_PRIORITY_CLASS: low
  KUEUE_QUEUE_NAME: cadc-default
  K6_OTEL_EXPORTER_PROTOCOL: http/protobuf
  K6_OTEL_HTTP_EXPORTER_INSECURE: "true"
  K6_OTEL_HTTP_EXPORTER_ENDPOINT: kube-prometheus-stack-prometheus.monitoring:9090
  K6_OTEL_HTTP_EXPORTER_URL_PATH: /api/v1/otlp/v1/metrics
  K6_OTEL_METRIC_PREFIX: k6_
  K6_OTEL_SERVICE_NAME: perfpulse-benchmark-small-kueue
  K6_OTEL_EXPORT_INTERVAL: 1s
  LOGICAL_USERS: "100"
  PERF_PULSE_CLIENT_MODE: kubernetes
  PROFILE: benchmark-small
  RUN_CLASS: benchmark
  SCENARIO: many-small-users
  SURFACE: k8s-kueue
  TOTAL_JOBS: "100"
  VISIBILITY_GATE_SECONDS: "120"
  WORKLOAD_NAMESPACE: canfar-workloads
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: benchmark-small
  name: perfpulse-benchmark-small-kueue-config
  namespace: canfar-perfpulse
---
apiVersion: v1
data:
  CLEANUP: "true"
  COMPLETION_GATE_SECONDS: "300"
  K6_OTEL_EXPORTER_PROTOCOL: http/protobuf
  K6_OTEL_HTTP_EXPORTER_INSECURE: "true"
  K6_OTEL_HTTP_EXPORTER_ENDPOINT: kube-prometheus-stack-prometheus.monitoring:9090
  K6_OTEL_HTTP_EXPORTER_URL_PATH: /api/v1/otlp/v1/metrics
  K6_OTEL_METRIC_PREFIX: k6_
  K6_OTEL_SERVICE_NAME: perfpulse-benchmark-small-skaha
  K6_OTEL_EXPORT_INTERVAL: 1s
  LOGICAL_USERS: "100"
  PERF_PULSE_CLIENT_MODE: kubernetes
  PROFILE: benchmark-small
  RUN_CLASS: benchmark
  SCENARIO: many-small-users
  SKAHA_API_URL: http://canfar-skaha-staging-skaha-tomcat-svc.canfar-system-staging.svc.keel-prod.local:8080/skaha/v1
  SKAHA_LOGIN_URL: https://ws-cadc.canfar.net/ac/login
  SKAHA_PASSWORD_PATH: /var/run/secrets/perfpulse/skaha-auth/password
  SKAHA_REQUEST_TIMEOUT_SECONDS: "120"
  SKAHA_USERNAME_PATH: /var/run/secrets/perfpulse/skaha-auth/username
  SUBMISSION_STAGGER_SECONDS: "1"
  SURFACE: skaha
  TOTAL_JOBS: "100"
  VISIBILITY_GATE_SECONDS: "120"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: benchmark-small
  name: perfpulse-benchmark-small-skaha-config
  namespace: canfar-perfpulse
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: benchmark-small
  name: perfpulse-benchmark-small-direct
  namespace: canfar-perfpulse
spec:
  arguments: "-o opentelemetry"
  initializer:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    image: images.opencadc.org/platform/perfpulse:TAG
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: canfar-perfpulse
  parallelism: 1
  runner:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    env:
      -
        name: TESTID
        value: benchmark-small-manual
    envFrom:
      -
        configMapRef:
          name: perfpulse-benchmark-small-direct-config
      -
        secretRef:
          name: perfpulse-otlp-credentials
          optional: true
    image: images.opencadc.org/platform/perfpulse:TAG
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: canfar-perfpulse
  script:
    localFile: /test/perfpulse.js
  starter:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: canfar-perfpulse
---
