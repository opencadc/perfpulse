apiVersion: v1
kind: Namespace
metadata:
  name: canfar-perfpulse
---
apiVersion: v1
kind: Namespace
metadata:
  name: canfar-workloads
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-direct-tiny
  name: perfpulse-runner
  namespace: canfar-perfpulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-direct-tiny
  name: perfpulse-workload-writer
  namespace: canfar-workloads
rules:
  -
    apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-direct-tiny
  name: perfpulse-workload-writer
  namespace: canfar-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perfpulse-workload-writer
subjects:
  -
    kind: ServiceAccount
    name: perfpulse-runner
    namespace: canfar-perfpulse
---
apiVersion: v1
data:
  CLEANUP: "true"
  COMPLETION_GATE_SECONDS: "120"
  K6_OTEL_EXPORTER_PROTOCOL: http/protobuf
  K6_OTEL_HTTP_EXPORTER_INSECURE: "true"
  K6_OTEL_HTTP_EXPORTER_ENDPOINT: kube-prometheus-stack-prometheus.monitoring:9090
  K6_OTEL_HTTP_EXPORTER_URL_PATH: /api/v1/otlp/v1/metrics
  K6_OTEL_METRIC_PREFIX: k6_
  K6_OTEL_SERVICE_NAME: perfpulse
  K6_OTEL_EXPORT_INTERVAL: 5s
  PERF_PULSE_CLIENT_MODE: kubernetes
  PROFILE: spot-direct-tiny
  RUN_CLASS: spot
  SURFACE: k8s-direct
  VISIBILITY_GATE_SECONDS: "60"
  WORKLOAD_NAMESPACE: canfar-workloads
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-direct-tiny
  name: perfpulse-spot-direct-tiny-config
  namespace: canfar-perfpulse
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-direct-tiny
  name: perfpulse-spot-direct-tiny
  namespace: canfar-perfpulse
spec:
  arguments: "-o opentelemetry"
  parallelism: 1
  runner:
    env:
      -
        name: TESTID
        value: spot-direct-tiny-manual
    envFrom:
      -
        configMapRef:
          name: perfpulse-spot-direct-tiny-config
      -
        secretRef:
          name: perfpulse-otlp-credentials
          optional: true
      -
        secretRef:
          name: perfpulse-skaha-runtime-token
          optional: true
    image: images.opencadc.org/platform/perfpulse:TAG
    serviceAccountName: perfpulse-runner
  script:
    localFile: /test/perfpulse.js
  starter:
    serviceAccountName: perfpulse-runner
