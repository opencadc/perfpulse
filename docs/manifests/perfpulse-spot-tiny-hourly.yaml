apiVersion: v1
kind: Namespace
metadata:
  name: canfar-perfpulse
---
apiVersion: v1
kind: Namespace
metadata:
  name: canfar-workloads
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-tiny
  name: canfar-perfpulse
  namespace: canfar-perfpulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-tiny
  name: perfpulse-workload-writer
  namespace: canfar-workloads
rules:
  -
    apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-tiny
  name: perfpulse-workload-writer
  namespace: canfar-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perfpulse-workload-writer
subjects:
  -
    kind: ServiceAccount
    name: canfar-perfpulse
    namespace: canfar-perfpulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-tiny
  name: perfpulse-testrun-writer
  namespace: canfar-perfpulse
rules:
  -
    apiGroups:
      - k6.io
    resources:
      - testruns
    verbs:
      - create
      - delete
      - get
      - list
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-tiny
  name: perfpulse-testrun-writer
  namespace: canfar-perfpulse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perfpulse-testrun-writer
subjects:
  -
    kind: ServiceAccount
    name: canfar-perfpulse
    namespace: canfar-perfpulse
---
apiVersion: v1
data:
  CLEANUP: "true"
  COMPLETION_GATE_SECONDS: "120"
  K6_OTEL_EXPORTER_PROTOCOL: http/protobuf
  K6_OTEL_HTTP_EXPORTER_INSECURE: "true"
  K6_OTEL_HTTP_EXPORTER_ENDPOINT: kube-prometheus-stack-prometheus.monitoring:9090
  K6_OTEL_HTTP_EXPORTER_URL_PATH: /api/v1/otlp/v1/metrics
  K6_OTEL_METRIC_PREFIX: k6_
  K6_OTEL_SERVICE_NAME: perfpulse
  K6_OTEL_EXPORT_INTERVAL: 5s
  PERF_PULSE_CLIENT_MODE: kubernetes
  PROFILE: spot-tiny
  RUN_CLASS: spot
  VISIBILITY_GATE_SECONDS: "60"
  WORKLOAD_NAMESPACE: canfar-workloads
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-tiny
  name: perfpulse-spot-tiny-config
  namespace: canfar-perfpulse
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-tiny
  name: perfpulse-spot-tiny-hourly
  namespace: canfar-perfpulse
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: perfpulse
            app.kubernetes.io/part-of: perfpulse
            perfpulse.opencadc.org/profile: spot-tiny
        spec:
          containers:
            -
              args:
                - |-
                  set -eu
                  TESTID="spot-tiny-$(date -u +%Y%m%d%H%M%S)"
                  cat <<YAML | kubectl apply -f -
                  apiVersion: k6.io/v1alpha1
                  kind: TestRun
                  metadata:
                    name: perfpulse-spot-tiny-${TESTID}
                    namespace: canfar-perfpulse
                    labels:
                      app.kubernetes.io/name: perfpulse
                      app.kubernetes.io/part-of: perfpulse
                      perfpulse.opencadc.org/profile: spot-tiny
                      perfpulse.opencadc.org/testid: ${TESTID}
                  spec:
                    cleanup: post
                    parallelism: 1
                    arguments: "-o opentelemetry"
                    script:
                      localFile: /test/perfpulse.js
                    initializer:
                      image: images.opencadc.org/platform/perfpulse:TAG
                      serviceAccountName: canfar-perfpulse
                      securityContext:
                        runAsGroup: 1000
                        runAsNonRoot: true
                        runAsUser: 1000
                        seccompProfile:
                          type: RuntimeDefault
                      containerSecurityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop:
                            - ALL
                        runAsGroup: 1000
                        runAsNonRoot: true
                        runAsUser: 1000
                        seccompProfile:
                          type: RuntimeDefault
                    runner:
                      image: images.opencadc.org/platform/perfpulse:TAG
                      serviceAccountName: canfar-perfpulse
                      securityContext:
                        runAsGroup: 1000
                        runAsNonRoot: true
                        runAsUser: 1000
                        seccompProfile:
                          type: RuntimeDefault
                      containerSecurityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop:
                            - ALL
                        runAsGroup: 1000
                        runAsNonRoot: true
                        runAsUser: 1000
                        seccompProfile:
                          type: RuntimeDefault
                      env:
                        - name: TESTID
                          value: ${TESTID}
                      envFrom:
                        - configMapRef:
                            name: perfpulse-spot-tiny-config
                        - secretRef:
                            name: perfpulse-otlp-credentials
                            optional: true
                        - secretRef:
                            name: perfpulse-skaha-runtime-token
                            optional: true
                    starter:
                      serviceAccountName: canfar-perfpulse
                      securityContext:
                        runAsGroup: 1000
                        runAsNonRoot: true
                        runAsUser: 1000
                        seccompProfile:
                          type: RuntimeDefault
                      containerSecurityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop:
                            - ALL
                        runAsGroup: 1000
                        runAsNonRoot: true
                        runAsUser: 1000
                        seccompProfile:
                          type: RuntimeDefault
                  YAML
              command:
                - /bin/sh
                - "-c"
              image: docker.io/bitnami/kubectl:1.31
              name: create-testrun
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
          restartPolicy: Never
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: canfar-perfpulse
      ttlSecondsAfterFinished: 900
  schedule: "0 * * * *"
  successfulJobsHistoryLimit: 1
