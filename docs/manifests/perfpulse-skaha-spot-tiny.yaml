apiVersion: v1
kind: Namespace
metadata:
  name: canfar-perfpulse
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-tiny
  name: canfar-perfpulse
  namespace: canfar-perfpulse
---
apiVersion: v1
data:
  CLEANUP: "true"
  COMPLETION_GATE_SECONDS: "120"
  K6_OTEL_EXPORTER_PROTOCOL: http/protobuf
  K6_OTEL_HTTP_EXPORTER_INSECURE: "true"
  K6_OTEL_HTTP_EXPORTER_ENDPOINT: kube-prometheus-stack-prometheus.monitoring:9090
  K6_OTEL_HTTP_EXPORTER_URL_PATH: /api/v1/otlp/v1/metrics
  K6_OTEL_METRIC_PREFIX: k6_
  K6_OTEL_SERVICE_NAME: perfpulse
  K6_OTEL_EXPORT_INTERVAL: 1s
  PERF_PULSE_CLIENT_MODE: kubernetes
  PROFILE: spot-tiny
  RUN_CLASS: spot
  SKAHA_API_URL: http://canfar-skaha-staging-skaha-tomcat-svc.canfar-system-staging.svc.keel-prod.local:8080/skaha/v1
  SKAHA_LOGIN_URL: https://ws-cadc.canfar.net/ac/login
  SKAHA_PASSWORD_PATH: /var/run/secrets/perfpulse/skaha-auth/password
  SKAHA_USERNAME_PATH: /var/run/secrets/perfpulse/skaha-auth/username
  SURFACE: skaha
  VISIBILITY_GATE_SECONDS: "60"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-tiny
  name: perfpulse-spot-skaha-tiny-config
  namespace: canfar-perfpulse
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: spot-tiny
  name: perfpulse-spot-skaha-tiny
  namespace: canfar-perfpulse
spec:
  arguments: "-o opentelemetry"
  initializer:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    image: images.opencadc.org/platform/perfpulse:TAG
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: canfar-perfpulse
  parallelism: 1
  runner:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    env:
      -
        name: TESTID
        value: spot-skaha-tiny-manual
    envFrom:
      -
        configMapRef:
          name: perfpulse-spot-skaha-tiny-config
      -
        secretRef:
          name: perfpulse-otlp-credentials
          optional: true
    image: images.opencadc.org/platform/perfpulse:TAG
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: canfar-perfpulse
    volumeMounts:
      -
        mountPath: /var/run/secrets/perfpulse/skaha-auth
        name: skaha-auth-credentials
        readOnly: true
    volumes:
      -
        name: skaha-auth-credentials
        secret:
          secretName: perfpulse-skaha-auth
  script:
    localFile: /test/perfpulse.js
  starter:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: canfar-perfpulse
