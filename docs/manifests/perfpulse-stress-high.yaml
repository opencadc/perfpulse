apiVersion: v1
kind: Namespace
metadata:
  name: canfar-perfpulse
---
apiVersion: v1
kind: Namespace
metadata:
  name: canfar-workloads
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: stress-high
  name: canfar-perfpulse
  namespace: canfar-perfpulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: stress-high
  name: perfpulse-workload-writer
  namespace: canfar-workloads
rules:
  -
    apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
  -
    apiGroups:
      - kueue.x-k8s.io
    resources:
      - workloads
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: stress-high
  name: perfpulse-workload-writer
  namespace: canfar-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perfpulse-workload-writer
subjects:
  -
    kind: ServiceAccount
    name: canfar-perfpulse
    namespace: canfar-perfpulse
---
apiVersion: v1
data:
  CLEANUP: "true"
  CONFIRM_STRESS: "true"
  K6_OTEL_EXPORTER_PROTOCOL: http/protobuf
  K6_OTEL_HTTP_EXPORTER_INSECURE: "true"
  K6_OTEL_HTTP_EXPORTER_ENDPOINT: kube-prometheus-stack-prometheus.monitoring:9090
  K6_OTEL_HTTP_EXPORTER_URL_PATH: /api/v1/otlp/v1/metrics
  K6_OTEL_METRIC_PREFIX: k6_
  K6_OTEL_SERVICE_NAME: perfpulse-stress-high-kueue
  K6_OTEL_EXPORT_INTERVAL: 30s
  KUEUE_ADMISSION_GATE_SECONDS: "1800"
  KUEUE_PRIORITY_CLASS: low
  KUEUE_QUEUE_NAME: cadc-default
  LOGICAL_USERS: "100"
  PERF_PULSE_CLIENT_MODE: kubernetes
  PRESERVE_ON_FAILURE: "false"
  PROFILE: stress-high
  RUN_CLASS: stress
  SCENARIO: throughput-stress
  SURFACE: k8s-kueue
  TOTAL_JOBS: "100000"
  VISIBILITY_GATE_SECONDS: "1800"
  WORKLOAD_NAMESPACE: canfar-workloads
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: stress-high
  name: perfpulse-stress-high-kueue-config
  namespace: canfar-perfpulse
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  labels:
    app.kubernetes.io/name: perfpulse
    app.kubernetes.io/part-of: perfpulse
    perfpulse.opencadc.org/profile: stress-high
  name: perfpulse-stress-high-kueue
  namespace: canfar-perfpulse
spec:
  arguments: "-o opentelemetry"
  initializer:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    image: images.opencadc.org/platform/perfpulse:TAG
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: canfar-perfpulse
  parallelism: 1
  runner:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    env:
      -
        name: TESTID
        value: stress-high-manual
    envFrom:
      -
        configMapRef:
          name: perfpulse-stress-high-kueue-config
      -
        secretRef:
          name: perfpulse-otlp-credentials
          optional: true
    image: images.opencadc.org/platform/perfpulse:TAG
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: canfar-perfpulse
  script:
    localFile: /test/perfpulse.js
  starter:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceAccountName: canfar-perfpulse
