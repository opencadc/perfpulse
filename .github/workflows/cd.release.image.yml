name: "CD: Release Image"

# Tag pushes work when a non-GITHUB_TOKEN credential creates the tag.
# repository_dispatch covers release-please releases created by GITHUB_TOKEN.
on:
  push:
    tags:
      - "v*"
  repository_dispatch:
    types: [perfpulse-release-build]

permissions:
  contents: read

env:
  REGISTRY: images.opencadc.org
  IMAGE: platform/perfpulse
  IMAGE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag_name || github.ref_name }}

jobs:
  release-image:
    if: >-
      github.repository == 'opencadc/perfpulse'
      && (github.event_name == 'repository_dispatch' || startsWith(github.ref_name, 'v'))
    concurrency:
      group: perfpulse-release-image-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag_name || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.ref }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.12
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and check
        run: bun run check
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
      - name: Perform Container Registry Login
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_SECRET }}
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.title=perfpulse
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.description=PerfPulse k6 workload runner
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.source=https://github.com/opencadc/perfpulse
            org.opencontainers.image.url=https://github.com/opencadc/perfpulse
            org.opencontainers.image.revision=${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.sha }}
      - name: Inspect multi-arch manifest
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}"
      - name: Attest Container Image
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          show-summary: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: v2.4.1
      - name: Cosign Container Image
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" --upload
