name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.12
      - uses: grafana/setup-k6-action@v1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run k6:dry-run
