name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.12
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Install dependencies
        run: bun ci
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Build k6 bundle
        run: bun run build
      - name: k6 dry run
        run: bun run k6:dry-run

  container-build:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.12
      - name: Install dependencies
        run: bun ci
      - name: Build k6 bundle
        run: bun run build
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha,scope=perfpulse-image
      - name: Build image with cache update
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha,scope=perfpulse-image
          cache-to: type=gha,mode=max,scope=perfpulse-image

  helm-validation:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Helm lint cron
        run: helm lint charts/cron
      - name: Helm lint campaign
        run: >-
          helm lint charts/campaign
          --set campaign.totalJobs=12
          --set campaign.logicalUsers=3
      - name: Helm template cron
        run: helm template perfpulse-cron charts/cron
      - name: Helm template campaign
        run: >-
          helm template perfpulse-campaign charts/campaign
          --set campaign.totalJobs=12
          --set campaign.logicalUsers=3
