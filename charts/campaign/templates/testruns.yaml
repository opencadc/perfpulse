{{- range $surface := .Values.surfaces }}
{{- $short := include "perfpulse.nameForSurface" $surface }}
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: perfpulse-campaign-{{ $short }}
  namespace: {{ $.Values.controlNamespace }}
  labels:
{{ include "perfpulse.labels" $ | indent 4 }}
    perfpulse.opencadc.org/profile: {{ $.Values.campaign.profile | quote }}
    perfpulse.opencadc.org/surface: {{ $surface }}
spec:
  cleanup: post
  parallelism: 1
  arguments: "-o opentelemetry"
  script:
    localFile: /test/perfpulse.js
  initializer:
    image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
    serviceAccountName: {{ include "perfpulse.serviceAccountName" $ }}
    securityContext:
{{ include "perfpulse.podSecurityContext" $ | indent 6 }}
    containerSecurityContext:
{{ include "perfpulse.containerSecurityContext" $ | indent 6 }}
  runner:
    image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
    serviceAccountName: {{ include "perfpulse.serviceAccountName" $ }}
    securityContext:
{{ include "perfpulse.podSecurityContext" $ | indent 6 }}
    containerSecurityContext:
{{ include "perfpulse.containerSecurityContext" $ | indent 6 }}
    env:
      - name: TESTID
        value: {{ $.Values.campaign.testid | quote }}
    envFrom:
      - configMapRef:
          name: perfpulse-campaign-{{ $short }}-config
      - secretRef:
          name: {{ $.Values.otlp.credentialsSecretName }}
          optional: true
    {{- if eq $surface "skaha" }}
    volumeMounts:
      - mountPath: /var/run/secrets/perfpulse/skaha-auth
        name: skaha-auth-credentials
        readOnly: true
    volumes:
      - name: skaha-auth-credentials
        secret:
          secretName: {{ $.Values.skaha.credentialsSecretName }}
    {{- end }}
  starter:
    serviceAccountName: {{ include "perfpulse.serviceAccountName" $ }}
    securityContext:
{{ include "perfpulse.podSecurityContext" $ | indent 6 }}
    containerSecurityContext:
{{ include "perfpulse.containerSecurityContext" $ | indent 6 }}
{{- end }}
