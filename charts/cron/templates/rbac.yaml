apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.controlNamespace }}
  labels:
{{ include "perfpulse.labels" . | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canfar-perfpulse
  namespace: {{ .Values.controlNamespace }}
  labels:
{{ include "perfpulse.labels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: perfpulse-workload-writer
  namespace: {{ .Values.workloadNamespace }}
  labels:
{{ include "perfpulse.labels" . | indent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: perfpulse-workload-writer
  namespace: {{ .Values.workloadNamespace }}
  labels:
{{ include "perfpulse.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perfpulse-workload-writer
subjects:
  - kind: ServiceAccount
    name: canfar-perfpulse
    namespace: {{ .Values.controlNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: perfpulse-testrun-writer
  namespace: {{ .Values.controlNamespace }}
  labels:
{{ include "perfpulse.labels" . | indent 4 }}
rules:
  - apiGroups: ["k6.io"]
    resources: ["testruns"]
    verbs: ["create", "delete", "get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: perfpulse-testrun-writer
  namespace: {{ .Values.controlNamespace }}
  labels:
{{ include "perfpulse.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perfpulse-testrun-writer
subjects:
  - kind: ServiceAccount
    name: canfar-perfpulse
    namespace: {{ .Values.controlNamespace }}
