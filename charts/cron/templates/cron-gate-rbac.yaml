{{- if .Values.cronGate }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cron-gate
  namespace: {{ .Values.controlNamespace }}
  labels:
{{ include "perfpulse.labels" . | indent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["delete", "get", "list"]
  - apiGroups: ["k6.io"]
    resources: ["testruns"]
    verbs: ["delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cron-gate
  namespace: {{ .Values.controlNamespace }}
  labels:
{{ include "perfpulse.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cron-gate
subjects:
  - kind: ServiceAccount
    name: {{ include "perfpulse.serviceAccountName" . }}
    namespace: {{ .Values.controlNamespace }}
{{- end }}
