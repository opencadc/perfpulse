{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: perfpulse-grafana-dashboard
  namespace: {{ .Values.controlNamespace }}
  labels:
{{ include "perfpulse.labels" . | indent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ .Values.grafanaDashboard.folder | quote }}
data:
  perfpulse.json: |-
{{ .Files.Get "dashboards/perfpulse.json" | indent 4 }}
{{- end }}
