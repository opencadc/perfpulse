---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: perfpulse-cron
  namespace: {{ .Values.controlNamespace }}
  labels:
{{ include "perfpulse.labels" . | indent 4 }}
    perfpulse.opencadc.org/run-class: cron
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ add (int .Values.completionTimeoutSeconds) (int .Values.observeSeconds) 60 }}
      backoffLimit: 0
      ttlSecondsAfterFinished: 900
      template:
        metadata:
          labels:
{{ include "perfpulse.labels" . | indent 12 }}
            perfpulse.opencadc.org/run-class: cron
        spec:
          serviceAccountName: {{ include "perfpulse.serviceAccountName" . }}
          restartPolicy: Never
          securityContext:
{{ include "perfpulse.podSecurityContext" . | indent 12 }}
          containers:
            - name: k6
              image: {{ include "perfpulse.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - |-
                  set -eu
                  TESTID="cron-$(date -u +%Y%m%d%H%M%S)"
                  export TESTID
                  export K6_OTEL_SERVICE_NAME="perfpulse-${TESTID}"
                  exec k6 run -o opentelemetry /test/perfpulse.js
              envFrom:
                - configMapRef:
                    name: perfpulse-cron-config
                - secretRef:
                    name: {{ .Values.otlp.credentialsSecretName }}
                    optional: true
              volumeMounts:
                - mountPath: /var/run/secrets/perfpulse/skaha-auth
                  name: skaha-auth-credentials
                  readOnly: true
              securityContext:
{{ include "perfpulse.containerSecurityContext" . | indent 16 }}
          volumes:
            - name: skaha-auth-credentials
              secret:
                secretName: {{ .Values.skaha.credentialsSecretName }}
                optional: true
